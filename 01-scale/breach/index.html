<!doctype html>
<html lang="en">
<head><script>if(/[?&]embed/.test(location.search))document.documentElement.classList.add('embed')</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vamsi Venkatesh · Breach</title>
<meta name="description" content="Vamsi Venkatesh, AI product engineer in Magdeburg, Germany.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 11 L15 5%22 stroke=%22%23ffd2a0%22 stroke-width=%221.4%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#04060b;--text:#efe7da;--muted:#a59d90;--warm:#ffd2a0;--ice:#cfe6ff;
  --serif:"Instrument Serif",Georgia,serif;--mono:"Martian Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;outline:none}
canvas#gl.dragging{cursor:grabbing}
.ui{position:fixed;z-index:2;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--warm);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus{position:fixed;width:auto;height:auto;clip:auto;left:24px;bottom:96px;z-index:5;font-family:var(--mono);font-size:11px;padding:8px 12px;border:1px solid #ffd2a055;color:var(--warm);background:#04060bcc}

#id{left:clamp(18px,3vw,34px);bottom:clamp(18px,3.2vh,32px);opacity:0;transition:opacity 1.6s ease}
#id h1{font-family:var(--serif);font-weight:400;font-size:clamp(21px,1.75vw,27px);letter-spacing:.005em;line-height:1;color:#f3eadc;text-shadow:0 1px 18px #0008}
#id p{margin-top:9px;font-family:var(--mono);font-weight:300;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#id.on{opacity:.92}
body.deep #id{opacity:.55}

#hint{left:0;top:0;transform-origin:0 50%;opacity:0;transition:opacity 1.1s ease;font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.2vw,18px);color:#fbe9d2;letter-spacing:.01em;white-space:nowrap;text-shadow:0 0 14px #000a}
#hint span{display:inline-block;margin-left:12px;font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#d9c7ae;opacity:.75;vertical-align:2px}
#hint.on{opacity:1}
#hint i{display:inline-block;width:22px;height:1px;background:linear-gradient(90deg,#fbe9d200,#fbe9d2);vertical-align:5px;margin-left:10px}

#opened{left:0;right:0;bottom:22vh;text-align:center;font-family:var(--serif);font-style:italic;font-size:clamp(26px,3vw,42px);color:#f6ead8;opacity:0;transform:translateY(8px);transition:opacity 2.4s ease,transform 2.4s cubic-bezier(.2,.7,.2,1);text-shadow:0 0 30px #000}
#opened small{display:block;margin-top:14px;font-family:var(--mono);font-style:normal;font-weight:300;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#a9bed4;opacity:.8}
#opened.on{opacity:1;transform:none}

#snd{right:clamp(16px,3vw,32px);bottom:clamp(18px,3.2vh,30px);pointer-events:auto;font-family:var(--mono);font-weight:300;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:9px;padding:8px 0;opacity:0;transition:opacity 1.6s ease,color .2s}
#snd.on{opacity:.85}
#snd:hover{color:var(--text)}
#snd b{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
#snd b i{display:block;width:2px;background:currentColor;height:3px;transition:height .3s}
#snd[aria-pressed=true] b i:nth-child(1){height:6px}#snd[aria-pressed=true] b i:nth-child(2){height:10px}#snd[aria-pressed=true] b i:nth-child(3){height:4px}

.chlabel{left:0;top:0;opacity:0;font-family:var(--serif);font-style:italic;font-size:19px;color:#ffe2bd;text-shadow:0 0 16px #000;white-space:nowrap}
.chlabel.on{opacity:1}
.map{left:50%;bottom:clamp(24px,3.6vh,34px);width:min(520px,44vw);transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity 1.2s ease .4s}
.map.on{opacity:1}
.map .track{position:relative;height:1px;background:linear-gradient(90deg,#cfe6ff22,#cfe6ffaa 10%,#cfe6ffaa 90%,#cfe6ff22)}
.map .you{position:absolute;top:-4px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#eaf4ff;box-shadow:0 0 12px #9fd0ff}
.map .tick{position:absolute;top:-9px;width:18px;height:18px;margin-left:-9px;pointer-events:auto;padding:0}
.map .tick::after{content:"";position:absolute;left:8.5px;width:1.5px;height:8px;background:#ffcf9a;opacity:.95;box-shadow:0 0 6px #ffcf9a;transition:opacity .2s,height .2s}
.map .tick.l::after{top:2px}.map .tick.r::after{top:9px}
.map .tick:hover::after,.map .tick:focus-visible::after{opacity:1;height:9px}
.panel{right:clamp(18px,4vw,64px);top:50%;width:min(400px,36vw);transform:translate(16px,-50%);opacity:0;pointer-events:none;transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1);
  padding:28px 30px 22px;background:linear-gradient(180deg,#0a1222d9,#060b16e6);border:1px solid #cfe6ff22;box-shadow:0 0 60px #000a,inset 0 1px 0 #ffffff10;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel.on{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
.panel .kick{font-family:var(--mono);font-weight:300;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#ffcf9a;opacity:.85}
.panel h2{margin-top:12px;font-family:var(--serif);font-weight:400;font-size:clamp(30px,2.6vw,40px);line-height:1.02;color:#f4ecdf}
.panel .line{margin-top:14px;font-family:var(--serif);font-size:19px;line-height:1.38;color:#dcd6cb}
.panel .sub{margin-top:8px;font-family:var(--mono);font-weight:300;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#a9bed4}
.panel .quiet{margin-top:18px;font-family:var(--mono);font-weight:300;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#7f8fa3}
.panel ul{margin-top:14px;list-style:none}
.panel li{font-family:var(--serif);font-size:19px;line-height:1.35;color:#dcd6cb;padding:8px 0;border-top:1px solid #cfe6ff14}
.panel .links a{color:#f4ecdf;text-decoration:none;border-bottom:1px solid #ffcf9a66}
.panel .links a:hover{border-color:#ffcf9a}
.panel .pnav{margin-top:22px;display:flex;gap:18px;font-family:var(--mono);font-weight:300;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase}
.panel .pnav button{color:#a9bed4;padding:6px 0}.panel .pnav button:hover{color:#fff}
.panel .pnav .close{margin-left:auto;color:#ffcf9a}
@media (max-width:700px){
  .map{bottom:74px;width:calc(100vw - 48px)}
  .panel{left:14px;right:14px;top:auto;bottom:96px;width:auto;transform:translateY(16px);padding:20px 20px 14px;max-height:52vh;overflow:auto}
  .panel.on{transform:none}
  .panel h2{font-size:30px}.panel .line,.panel li{font-size:17px}
}
#err{left:20px;right:20px;top:45%;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);display:none}
</style>
</head>
<body>
<canvas id="gl" tabindex="-1" aria-label="A desk at dusk in Magdeburg. A faint seam crosses the room; drag along it to open the room."></canvas>
<button class="sr" id="kb">Open the seam (Enter)</button>
<div class="ui" id="hint" aria-hidden="true">drag the seam<i></i><span>or tap</span></div>
<div class="ui" id="id"><h1>Vamsi Venkatesh</h1><p>AI product engineer · Magdeburg</p></div>
<div class="ui" id="opened" aria-live="polite"></div>
<button class="ui" id="snd" aria-pressed="false" aria-label="Sound"><b><i></i><i></i><i></i></b><em style="font-style:normal">sound off</em></button>
<div class="ui" id="err">This piece needs WebGL2.</div>
<script type="module" src="./breach.js"></script>
</body>
</html>
