<style>
  :root { --sky: #f6dcb6; --frame: #2d4a2a; --accent: #2f8f4e; --note: #fff4d6; }
  .sun-rise { animation: rise 2.6s cubic-bezier(.2,.8,.2,1) .3s both; }
  @keyframes rise { from { transform: translateY(260px); } }
  .rays { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
  @keyframes spin { to { rotate: 360deg; } }
  .win { fill: #fff3c4; opacity: .7; }
  .ping { fill: none; stroke: #d8412f; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ping 2.75s ease-out infinite; opacity: 0; }
  @keyframes ping { 0% { transform: scale(.3); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
  .pin-leg { stroke: #3b2b1d; stroke-width: 2.5; }
  .hand-label { font: 600 26px var(--hand); fill: #3b2b1d; }
  .road { fill: none; stroke: #e8c98e; stroke-width: 30; stroke-linecap: round; }
  .road-mid { fill: none; stroke: #fff4d6; stroke-width: 2.5; stroke-dasharray: 14 16; animation: roll 1.2s linear infinite; }
  @keyframes roll { to { stroke-dashoffset: -30; } }
  .furrow { stroke: rgba(60, 40, 10, .22); stroke-width: 2; }
  .barn-x { stroke: #b8452f; stroke-width: 5; }
  .smoke circle { fill: rgba(255, 255, 255, .7); transform-box: fill-box; transform-origin: center; animation: smoke 3.6s ease-out infinite; opacity: 0; }
  @keyframes smoke { 0% { transform: translate(0, 0) scale(.5); opacity: .8; } 100% { transform: translate(24px, -90px) scale(1.6); opacity: 0; } }
  .slat { stroke: rgba(90, 50, 18, .35); stroke-width: 3; }
  .spoke { stroke: #9aa0a8; stroke-width: 2; }
  .wing { fill: none; stroke: #3b2b1d; stroke-width: 2.6; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: flap .5s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: scaleY(-.6); } }
  .crop { animation: sway 3.2s ease-in-out infinite alternate; }
  @keyframes sway { from { rotate: -4deg; } to { rotate: 4deg; } }
  .blade { fill: #3f6f30; }
  .antenna { stroke: #3b2b1d; stroke-width: 3; }
  .blink { fill: #f0b83c; animation: blink 1.6s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { fill: #d8412f; } }
  .eye { fill: #2d3038; } .ink { fill: rgba(59, 43, 29, .4); }
  @media (prefers-reduced-motion: reduce) { .sun-rise, .rays, .ping, .road-mid, .smoke circle, .wing, .crop, .blink { animation: none; } .ping { opacity: 0; } .smoke circle { opacity: .5; } }
</style>
