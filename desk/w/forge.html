<style>
  :root { --sky: #1f2a44; --frame: #10172b; --accent: #c8642d; --note: #fff4d6; }
  .star{fill:#fff4d6} .tw{animation:tw 2.6s ease-in-out infinite} @keyframes tw{50%{opacity:.25}}
   .tickmark{stroke:#3b2b1d;stroke-width:3} .hand{stroke:#3b2b1d;stroke-linecap:round} .hand.h{stroke-width:6} .hand.m{stroke-width:4}
   .board{stroke:rgba(0,0,0,.18);stroke-width:2} .lamp-arm{fill:none;stroke:#3b2b1d;stroke-width:7;stroke-linecap:round}
   .cone{fill:rgba(255,220,150,.22);mix-blend-mode:screen} .glass{fill:rgba(200,228,255,.12);stroke:rgba(220,240,255,.75);stroke-width:4}
   .glass-shine{stroke:rgba(255,255,255,.45);stroke-width:6;stroke-linecap:round;fill:none}
   .lid{animation:lidDown 1s cubic-bezier(.3,1.5,.5,1) 1.1s both} @keyframes lidDown{from{transform:translateY(-420px)}}
   .seal{transform-box:fill-box;transform-origin:center;animation:stampIn .5s cubic-bezier(.3,1.6,.5,1) 2.2s both} @keyframes stampIn{from{opacity:0;transform:scale(2.6)}}
   .seal-t{font:700 12px var(--serif);fill:#fbe3d9;letter-spacing:.06em}
   .lock{animation:lockIn .4s ease 2s both} @keyframes lockIn{from{opacity:0;transform:translateY(-20px)}}
   .shackle{fill:none;stroke:#9aa0a8;stroke-width:8} .arrow{fill:none;stroke:#f3ead6;stroke-width:2.5;stroke-dasharray:6 6}
   .k-hand{fill:#f3ead6} .safe-t{font:600 18px var(--serif);fill:#f3ead6;letter-spacing:.14em} .link{fill:none;stroke:#c9ced6;stroke-width:6}
   @media (prefers-reduced-motion:reduce){.lid,.seal,.lock,.tw{animation:none}}
</style>
